<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- External CSS Link -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>EXPENSE TRACKER</h2>
        </div>

        <!-- Summary Cards -->
        <div class="summary-cards">
            <div class="card balance">
                <h4>YOUR BALANCE</h4>
                <p id="total-balance">₹0.00</p>
            </div>
            <div class="card income">
                <h4>TOTAL INCOME</h4>
                <p id="total-income">+ ₹0.00</p>
            </div>
            <div class="card expense">
                <h4>TOTAL EXPENSE</h4>
                <p id="total-expense">- ₹0.00</p>
            </div>
        </div>

        <!-- Add/Edit Transaction Form -->
        <div class="form-section">
            <h3 id="form-title">ADD NEW TRANSACTION</h3>
            <form id="transaction-form">
                <input type="hidden" id="edit-id" value="">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" placeholder="e.g. Swiggy Lunch, Salary" required />
                    </div>
                    <div class="form-group">
                        <label for="amount">Amount (₹)</label>
                        <input type="number" id="amount" step="any" placeholder="500" required />
                    </div>
                    <div class="form-group">
                        <label for="type">Type</label>
                        <select id="type">
                            <option value="expense">Expense</option>
                            <option value="income">Income</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category">
                            <option value="Salary">Salary</option>
                            <option value="Food & Dining">Food & Dining</option>
                            <option value="Rent & Bills">Rent & Bills</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" required />
                    </div>
                </div>
                <button type="submit" class="btn-submit" id="submit-btn">Add Transaction</button>
            </form>
        </div>

        <!-- Transaction History Header & Category Filter -->
        <div class="controls">
            <h3>TRANSACTION HISTORY</h3>
            <div class="filter-group">
                <label for="filter-category">Filter Category:</label>
                <select id="filter-category">
                    <option value="All">All Categories</option>
                    <option value="Salary">Salary</option>
                    <option value="Food & Dining">Food & Dining</option>
                    <option value="Rent & Bills">Rent & Bills</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </div>

        <!-- History List -->
        <ul id="history-list" class="history-list"></ul>
    </div>

    <!-- External JavaScript Link -->
    <script src="script.js"></script>
</body>
</html>
